<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">RivalsPulse</title>
  <!-- The light-theme twin of rivals-pulse-logo.svg: the same shapes on the light surface, in the light theme's accent, secondary and tertiary tokens (each at least 3:1 on the panel). -->
  <defs>
    <filter id="spark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#ffffff"/>
  <polyline points="8,140 40,140 56,112 72,170 92,84 110,140 120,140" fill="none" stroke="#b38600"
            stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="248,140 216,140 200,168 184,110 164,196 146,140 136,140" fill="none" stroke="#5b55e6"
            stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 104 L136 132 L162 140 L136 148 L128 176 L120 148 L94 140 L120 132 Z" fill="#b44fd6"
        filter="url(#spark-glow)"/>
</svg>
