<button class="menu-toggle" type="button" aria-label="Toggle navigation menu" aria-controls="primary-navigation"
    [attr.aria-expanded]="isMenuOpen()" (click)="toggleMenu()">
    <span class="menu-toggle-icon" aria-hidden="true"></span>
    <span class="menu-toggle-label">Menu</span>
</button>

<nav id="primary-navigation" aria-label="Primary navigation" [class.is-open]="isMenuOpen()">
    @for (item of primaryNavItems; track item.label) {
    @if (item.enabled) {
    <a class="nav-link" [routerLink]="item.path" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }" (click)="closeMenu()">
        {{ item.label }}
    </a>
    } @else {
    <span class="disabled">{{ item.label }}</span>
    }
    }
    @if (statsLink(); as path) {
    <a class="nav-link" [routerLink]="path" routerLinkActive="active" (click)="closeMenu()">My stats</a>
    }
    @if (accountLink(); as link) {
    <a class="nav-link" [routerLink]="link.path" routerLinkActive="active" [attr.aria-label]="link.ariaLabel"
        [attr.title]="link.player ? link.label : null" (click)="closeMenu()">
        @if (link.player; as player) {
        <span class="nav-player">
            <app-player-avatar [name]="player.name" [avatarUrl]="player.avatarUrl" />
            <span class="nav-player-name">{{ link.label }}</span>
        </span>
        } @else {
        {{ link.label }}
        }
    </a>
    }
</nav>

<a class="core-orb" routerLink="/" fragment="jarvis-console" (click)="closeMenu()"
    aria-label="Jump to the Jarvis console">
    <span class="core-orb-glow" aria-hidden="true"></span>
</a>
