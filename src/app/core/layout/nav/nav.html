<button #toggle class="menu-toggle" type="button" aria-controls="primary-navigation"
  [attr.aria-expanded]="isMenuOpen()" (click)="toggleMenu()">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" aria-hidden="true" focusable="false">
    @if (isMenuOpen()) {
      <path d="M4 4l12 12M16 4L4 16" />
    } @else {
      <path d="M3 5h14M3 10h14M3 15h14" />
    }
  </svg>
  Menu
</button>

<nav id="primary-navigation" aria-label="Primary navigation" [class.is-open]="isMenuOpen()">
  <a class="nav-link nav-home" [routerLink]="homeItem.path"
    [attr.aria-current]="activePath() === homeItem.path ? 'page' : null" (click)="closeMenu()">{{ homeItem.label }}</a>
  @for (item of primaryNavItems; track item.path) {
    <a class="nav-link" [routerLink]="item.path" [attr.aria-current]="activePath() === item.path ? 'page' : null"
      (click)="closeMenu()">{{ item.label }}</a>
  }
  @if (accountLink(); as link) {
    <a class="nav-link nav-account" [routerLink]="link.path" [attr.aria-current]="activePath() === link.path ? 'page' : null"
      [attr.aria-label]="link.ariaLabel" [attr.title]="link.player ? link.label : null" (click)="closeMenu()">
      @if (link.player; as player) {
        <app-player-avatar [name]="player.name" [avatarUrl]="player.avatarUrl" />
        <span class="nav-player-name">{{ link.label }}</span>
      } @else {
        {{ link.label }}
      }
    </a>
  } @else {
    <span class="nav-link nav-account nav-pending" aria-hidden="true">Sign in</span>
  }
</nav>
