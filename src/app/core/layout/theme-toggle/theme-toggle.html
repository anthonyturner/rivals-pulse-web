<button type="button" class="theme-toggle" [attr.aria-label]="label()" [attr.title]="label()" (click)="toggle()">
  <span class="theme-toggle__icon" aria-hidden="true">
    <span class="to-light">&#x2600;&#xFE0F;</span><span class="to-dark">&#x1F319;</span>
  </span>
  <span class="theme-toggle__text" aria-hidden="true">
    <span class="to-light">Light theme</span><span class="to-dark">Dark theme</span>
  </span>
</button>
