<div class="sidebar">
  @if (pageContent(); as template) {
    <div class="sidebar__page-content page-container page-container--wide">
      <ng-container [ngTemplateOutlet]="template" />
    </div>
  }
  @if (!thin()) {
    <aside class="sidebar__ads" aria-label="Advertisement">
      <app-ad-slot slot="rectangle" />
    </aside>
  }
</div>
