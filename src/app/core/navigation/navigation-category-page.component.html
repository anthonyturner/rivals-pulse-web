<div class="category page-container page-container--wide">
  <app-page-header [title]="category.label" [description]="category.description" />

  @if (tiles; as config) {
    <app-hub-bento [links]="released" [config]="config" />
  } @else {
    <ul class="grid">
      @for (item of released; track item.path) {
        <li><app-guide-card [title]="item.label" [route]="item.path" [blurb]="item.description" /></li>
      }
    </ul>
  }

  @if (comingSoon.length > 0) {
    <section aria-labelledby="coming-soon-title">
      <h2 id="coming-soon-title">Coming soon</h2>
      <ul class="grid soon">
        @for (item of comingSoon; track item.path) {
          <li>
            <strong>{{ item.label }}</strong>
            <p>{{ item.description }}</p>
          </li>
        }
      </ul>
    </section>
  }
</div>
