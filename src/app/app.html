<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

<header class="top-nav" #header>
  <a class="brand" routerLink="/" aria-label="RivalsPulse home">
    <span class="brand-mark" aria-hidden="true">RP</span>
    <span class="brand-name">Rivals<span class="brand-accent">Pulse</span></span>
  </a>
  <app-nav />
</header>

<div class="app-body" [class.app-body--with-sidebar]="hasSidebar()">
  <main id="main-content" tabindex="-1" #main>
    <router-outlet />
  </main>
  @if (hasSidebar()) {
    <app-sidebar class="app-body__sidebar" />
  }
</div>

<app-footer />
