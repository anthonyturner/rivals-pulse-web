<app-home-band
  tone="white"
  eyebrow="On the web"
  heading="Tools"
  headingId="home-tools-title"
  lede="Open them right here in your browser. No install needed."
>
  <ul class="tools">
    @for (tool of tools; track tool.path) {
      <li>
        <a class="tool" [routerLink]="tool.path">
          <span class="tool-icon" aria-hidden="true">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              @for (circle of tool.iconCircles; track $index) {
                <circle [attr.cx]="circle.cx" [attr.cy]="circle.cy" [attr.r]="circle.r" />
              }
              <path [attr.d]="tool.iconPath" />
            </svg>
          </span>
          <h3>{{ tool.title }}</h3>
          <p>{{ tool.promise }}</p>
          @if (tool.inOverlay; as overlay) {
            <p class="tool-overlay">
              <span class="tool-overlay__tag">In the overlay</span>
              {{ overlay.feature }} <kbd>{{ overlay.key }}</kbd>
            </p>
          }
        </a>
      </li>
    }
  </ul>
</app-home-band>
