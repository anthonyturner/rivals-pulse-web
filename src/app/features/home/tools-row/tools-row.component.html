<section class="tools-row" aria-labelledby="home-tools-title">
  <header class="tools-row-head">
    <p class="eyebrow">Tools</p>
    <h2 id="home-tools-title">Answer it in one click.</h2>
  </header>

  <ul class="tools">
    @for (tool of tools; track tool.path) {
      <li>
        <a class="tool" [routerLink]="tool.path">
          <span class="tool-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
            >
              @for (circle of tool.iconCircles; track $index) {
                <circle [attr.cx]="circle.cx" [attr.cy]="circle.cy" [attr.r]="circle.r" />
              }
              <path [attr.d]="tool.iconPath" />
            </svg>
          </span>
          <h3>{{ tool.title }}</h3>
          <p>{{ tool.promise }}</p>
          <span class="tool-action">{{ tool.action }} →</span>
        </a>
      </li>
    }
  </ul>
</section>
