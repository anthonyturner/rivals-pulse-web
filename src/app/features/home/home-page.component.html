<div class="home-page">
  <div class="hero-stage">
    <div
      class="home-page-background"
      [class.is-foreground]="backgroundVideoForeground"
      [class.is-popout]="backgroundVideoPoppedOut"
      [attr.role]="backgroundVideoForeground ? 'dialog' : 'button'"
      [attr.aria-modal]="backgroundVideoForeground ? 'true' : null"
      [attr.aria-label]="
        backgroundVideoForeground
          ? heroMedia().title + ' video player'
          : backgroundVideoPoppedOut
            ? 'Open the floating video player'
            : 'Play the background video in the foreground'
      "
      [attr.tabindex]="backgroundVideoForeground ? -1 : 0"
      (click)="onBackgroundVideoSurfaceClick(backgroundVideo)"
      (keydown)="onBackgroundVideoKeydown($event, backgroundVideo)"
    >
      <video
        #backgroundVideo
        class="home-page-background-video"
        autoplay
        [controls]="backgroundVideoForeground"
        [muted]="backgroundVideoMuted"
        [src]="heroMedia().videoUrl"
        loop
        playsinline
        preload="metadata"
        [poster]="heroMedia().posterUrl"
        tabindex="-1"
        (canplay)="startBackgroundVideo(backgroundVideo)"
        (click)="onForegroundVideoClick($event)"
        (volumechange)="syncBackgroundVideoSound(backgroundVideo)"
      >
        Your browser does not support embedded video playback.
      </video>

      @if (backgroundVideoForeground) {
        <button
          #videoClose
          class="home-page-video-close"
          type="button"
          aria-label="Close foreground video"
          (click)="$event.stopPropagation(); closeBackgroundVideo()"
        >
          Close
        </button>
      }
    </div>

    <button
      class="home-page-sound-toggle"
      type="button"
      [attr.aria-label]="backgroundVideoMuted ? 'Unmute background video' : 'Mute background video'"
      [attr.aria-pressed]="!backgroundVideoMuted"
      (click)="toggleBackgroundVideoSound(backgroundVideo)"
    >
      {{ backgroundVideoMuted ? 'Sound off' : 'Sound on' }}
    </button>

    <header #heroBanner class="season-hero">
      <div class="hero-copy">
        <app-eyebrow>Free Overwolf app for Marvel Rivals</app-eyebrow>
        <h1>Know every match before it starts.</h1>
        <p class="lede">RivalsPulse puts live stats on your screen and counters at your fingertips.</p>

        <app-hero-overlay-actions />
      </div>
    </header>
  </div>

  <main>
    <app-overlay-section />
    <app-stats-snapshot />
    <app-tools-row />
    <app-how-it-works />
    <app-game-news-band [content]="homeContent()" (watchVideo)="onWatchUpdateVideo(backgroundVideo)" />
    <app-home-faq />
    <app-closing-cta />
  </main>
</div>
