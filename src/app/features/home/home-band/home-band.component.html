<section
  class="band"
  [class.band--white]="tone() === 'white'"
  [class.band--center]="headAlign() === 'center'"
  [attr.aria-labelledby]="headingId()"
>
  <div class="band__inner">
    <header class="band__head">
      @if (eyebrow(); as text) {
        <app-eyebrow>{{ text }}</app-eyebrow>
      }
      <h2 class="band__title" [id]="headingId()">{{ heading() }}</h2>
      @if (lede(); as text) {
        <p class="band__lede">{{ text }}</p>
      }
    </header>

    <ng-content />
  </div>
</section>
