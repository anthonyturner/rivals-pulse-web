<app-home-band
  tone="dark"
  heading="What the overlay does"
  headingId="overlay-section-title"
  lede="RivalsPulse runs beside Marvel Rivals through Overwolf and puts your match on screen while you play."
>
  <div class="overlay-section">
    <ul class="shots">
      @for (shot of screenshots; track shot.src) {
        <li>
          <figure class="shot">
            <img
              class="shot__image"
              [src]="shot.src"
              [attr.width]="shot.width"
              [attr.height]="shot.height"
              [alt]="shot.alt"
              loading="lazy"
            />
            <figcaption class="shot__caption">{{ shot.caption }}</figcaption>
          </figure>
        </li>
      }
    </ul>

    <ul class="features">
      @for (feature of features; track feature.title) {
        <li class="feature">
          <span class="feature-icon" aria-hidden="true">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path [attr.d]="feature.iconPath" />
            </svg>
          </span>
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.description }}</p>
          <p class="keys">
            <span class="keys__label">Default hotkeys</span>
            @for (key of feature.keys; track key) {
              <kbd>{{ key }}</kbd>
            }
          </p>
        </li>
      }
    </ul>

    <app-jarvis-console />
  </div>
</app-home-band>
