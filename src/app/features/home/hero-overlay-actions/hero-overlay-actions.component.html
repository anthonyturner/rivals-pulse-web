<div class="hero-actions">
  <app-get-app-button />

  <a class="cta cta-ghost" routerLink="/community">See stats</a>
</div>

<p class="safety-note">
  Will it get me banned? <a class="safety-link" routerLink="/faq">No — here's why</a>
</p>

<div class="trust-row">
  <p class="trust-line" [class.is-loading]="loading()" [attr.aria-busy]="loading()">
    @if (trustLine(); as line) {
      {{ line.text }}
    } @else {
      <span class="skeleton" aria-hidden="true"></span>
    }
  </p>

  @if (trustLine()) {
    <a class="how-we-count" routerLink="/how-we-count">How we count</a>
  }
</div>
