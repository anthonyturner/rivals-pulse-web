<div class="library page-container page-container--wide">
  <app-page-header
    title="Guides"
    description="Hero playbooks, fundamentals and strategist lessons for Marvel Rivals."
  >
    <p lede>
      Looking for video tutorials, user highlights or the glossary? They are in
      <a routerLink="/resources">Resources</a>.
    </p>
  </app-page-header>

  @for (section of sections; track section.title) {
    <section>
      <h2>{{ section.title }}</h2>
      <app-hub-bento [links]="section.links" [config]="section.tiles" [headingLevel]="3" />
    </section>
  }
</div>
