<div class="media page-container page-container--wide">
  <app-page-header
    title="Video tutorials"
    description="Tutorials, masterclasses, VOD reviews and map guides for Marvel Rivals. Each video loads when you play it."
  />

  <div class="guide-toolbar">
    <label class="guide-search">
      <span>Search tutorials</span>
      <input type="search" [value]="searchTerm()" (input)="updateSearch($event)" />
    </label>
    <app-filter-select
      label="Category"
      [options]="categoryOptions"
      [value]="category()"
      (valueChange)="category.set($event)"
    />
  </div>
  <p class="guide-count" role="status">{{ status() }}</p>

  @if (featured(); as lead) {
    <app-tutorial-card [tutorial]="lead" [featured]="true" [headingLevel]="2" />

    @for (group of groups(); track group.category) {
      <section class="group" [attr.aria-labelledby]="'topic-' + $index">
        <h2 class="group__title" [id]="'topic-' + $index">
          <span class="chip" [attr.data-kind]="group.kind">{{ group.category }}</span>
        </h2>
        <ul class="cards" [attr.aria-label]="group.category + ' tutorials'">
          @for (tutorial of group.tutorials; track tutorial.id) {
            <li><app-tutorial-card [tutorial]="tutorial" /></li>
          }
        </ul>
      </section>
    }
  } @else {
    <app-state-panel [announce]="false">No tutorials match. Clear the search or set Category to All.</app-state-panel>
  }
</div>
