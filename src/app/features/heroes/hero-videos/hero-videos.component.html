<aside class="hero-videos" [attr.aria-label]="'YouTube videos for ' + heroName()">
  <h2 class="hero-videos__heading">YouTube videos</h2>
  <div class="hero-videos__list">
    @for (video of videos(); track video.url) {
      <article class="video-card">
        @if (video.youtubeId; as youtubeId) {
          <app-youtube-player
            [videoId]="youtubeId"
            [title]="heroName() + ' ' + video.label"
            [label]="'Play ' + heroName() + ' ' + video.label + ' video'"
          />
        }
        <span class="video-copy">
          <strong>{{ video.label }}</strong>
          <small>{{ video.query }}</small>
          <a
            [href]="video.url"
            [attr.aria-label]="'Open on YouTube: ' + video.label"
            target="_blank"
            rel="noopener noreferrer"
            >Open on YouTube</a
          >
        </span>
      </article>
    }
  </div>
  <a class="video-all" [href]="youtubeUrl()" target="_blank" rel="noopener noreferrer">View all on YouTube</a>
</aside>
