@let current = view();

<app-community-summary
  [kind]="current.kind"
  heading="Damage, healing and damage blocked per minute"
  subject="community per-minute role figures"
  [summary]="current.kind === 'not-enough-data' ? current.summary : ''"
  [halfSeasonLabel]="current.kind === 'ready' ? current.halfSeasonLabel : null"
  [notice]="current.kind === 'ready' ? current.notice : null"
>
  @if (current.kind === 'ready') {
    <div class="role-figures__cards">
      @for (card of current.cards; track card.role) {
        <article class="role-figures__card" [attr.data-role]="card.roleKey" [attr.aria-labelledby]="'role-figures-' + card.roleKey">
          <h3 class="role-figures__name" [id]="'role-figures-' + card.roleKey">
            <span class="role-figures__dot" aria-hidden="true"></span>{{ card.role }}
          </h3>
          <ul class="role-figures__bars">
            @for (bar of card.bars; track bar.label) {
              <li class="role-figures__bar">
                <span class="role-figures__label">{{ bar.label }}</span>&ngsp;<span
                  class="role-figures__value"
                  [class.role-figures__none]="bar.percent === null"
                  >{{ bar.value }}</span
                >
                <app-meter class="role-figures__meter" [value]="bar.percent ?? 0" />
              </li>
            }
          </ul>
        </article>
      }
    </div>
    <p class="role-figures__note">{{ current.note }}</p>
  }
</app-community-summary>
