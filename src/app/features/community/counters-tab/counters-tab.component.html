@let current = view();

<app-community-summary
  [kind]="current.kind"
  heading="Counter matchups"
  subject="counter matchups"
  [summary]="current.kind === 'not-enough-data' ? current.summary : ''"
  [halfSeasonLabel]="current.kind === 'ready' ? current.halfSeasonLabel : null"
  [notice]="current.kind === 'ready' ? current.notice : null"
  [footnote]="current.kind === 'ready' ? current.footnote : null"
  [link]="link"
>
  @if (current.kind === 'ready') {
    <ol class="records">
      @for (record of current.records; track record.key) {
        <li [attr.title]="record.description">
          <div class="record">
            <div class="winner">
              <span class="hero">
                <img [src]="record.winner.imageUrl" alt="" width="36" height="36" loading="lazy" (error)="onImageError($event)" />
                <span class="name">{{ record.winner.name }}</span>
              </span>&ngsp;<span class="verb">wins against</span>
            </div>&ngsp;<span class="hero">
              <img [src]="record.loser.imageUrl" alt="" width="36" height="36" loading="lazy" (error)="onImageError($event)" />
              <span class="name">{{ record.loser.name }}</span>
            </span>&ngsp;<span class="result">
              <span class="figure">{{ record.winRate }}</span>&ngsp;<span class="sample">{{ record.sample }}</span>
            </span>
          </div>
        </li>
      }
    </ol>
  }
</app-community-summary>
