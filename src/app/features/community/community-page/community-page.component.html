<section class="community-page page-container page-container--wide">
  <app-page-header
    title="Community totals"
    description="Anonymous totals from players' uploads: no names or ids, and a number shows only once enough matches back it, and while few players upload it can come from one player."
  />

  <app-hub-bento class="community-page__tiles" [links]="links" [config]="tiles" />

  <div #tabList class="community-page__tabs" role="tablist" aria-label="Community totals by app screen">
    @for (tab of tabs(); track tab.id; let index = $index) {
      <a
        #tabLink
        class="community-page__tab"
        role="tab"
        [id]="tab.tabId"
        [routerLink]="['..', tab.id]"
        [attr.aria-selected]="tab.selected"
        aria-controls="community-panel"
        [attr.tabindex]="tab.selected ? 0 : -1"
        (keydown)="onTabKeydown($event, index)"
      >
        {{ tab.label }}
      </a>
    }
  </div>

  <div
    id="community-panel"
    class="community-page__panel"
    role="tabpanel"
    tabindex="0"
    [attr.aria-labelledby]="selectedTab().tabId"
  >
    <ng-container [ngComponentOutlet]="selectedTab().component" />
  </div>
</section>
