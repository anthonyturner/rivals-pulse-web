@let current = view();

<app-community-summary
  [kind]="current.kind"
  heading="Hero pick and win rates"
  subject="hero numbers"
  [summary]="current.kind === 'not-enough-data' ? current.summary : ''"
  [halfSeasonLabel]="current.kind === 'ready' ? current.halfSeasonLabel : null"
  [notice]="current.kind === 'ready' ? current.notice : null"
  [footnote]="current.kind === 'ready' ? current.footnote : null"
  [link]="link"
>
  @if (current.kind === 'ready') {
    <div class="lists">
      <section class="list" aria-labelledby="heroes-tab-picked">
        <h3 id="heroes-tab-picked" class="list-title">Most picked</h3>
        <app-community-hero-list [heroes]="current.mostPicked" figureLabel="Pick rate" />
      </section>
      <section class="list" aria-labelledby="heroes-tab-won">
        <h3 id="heroes-tab-won" class="list-title">Highest win rate</h3>
        <app-community-hero-list [heroes]="current.highestWinRate" figureLabel="Win rate" />
      </section>
    </div>
  }
</app-community-summary>

@let figuresCurrent = figuresView();

<app-community-summary
  class="figures"
  [kind]="figuresCurrent.kind"
  heading="Community hero damage, healing and damage blocked"
  subject="community hero damage, healing and damage blocked per minute"
  [summary]="figuresCurrent.kind === 'not-enough-data' ? figuresCurrent.summary : ''"
  [halfSeasonLabel]="figuresCurrent.kind === 'ready' ? figuresCurrent.halfSeasonLabel : null"
  [notice]="figuresCurrent.kind === 'ready' ? figuresCurrent.notice : null"
  [footnote]="figuresCurrent.kind === 'ready' ? figuresFootnote : null"
>
  @if (figuresCurrent.kind === 'ready') {
    <div class="lists">
      @for (group of figuresCurrent.groups; track group.key) {
        <section class="list" [attr.aria-labelledby]="'heroes-tab-figure-' + group.key">
          <h3 [id]="'heroes-tab-figure-' + group.key" class="list-title">{{ group.title }}</h3>
          <app-community-hero-list [heroes]="group.heroes" [figureLabel]="group.figureLabel" />
        </section>
      }
    </div>
  }
</app-community-summary>
