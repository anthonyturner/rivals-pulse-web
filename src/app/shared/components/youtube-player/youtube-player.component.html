@if (started()) {
  <iframe
    class="player"
    [src]="embedUrl()"
    [title]="title()"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
} @else {
  <button type="button" class="play" [attr.aria-label]="label()" (click)="play()">
    <img
      class="play__image"
      [src]="thumbnailUrl()"
      alt=""
      width="480"
      height="360"
      [attr.loading]="eager() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="eager() ? 'high' : null"
      decoding="async"
    />
    <span class="play__marker" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path d="M8 5.5v13l11-6.5z" fill="currentColor" /></svg>
    </span>
  </button>
}
