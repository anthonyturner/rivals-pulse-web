name: Close linked issue on PR merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-linked-issue:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine linked issue number
        id: linked-issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branchName = pr.head.ref || '';
            const body = `${pr.body || ''}\n${pr.title || ''}`;

            const branchMatch = branchName.match(/issue-(\d+)(?:-|$)/i);
            const bodyMatch = body.match(/(?:close|closes|closed|fix|fixes|resolve|resolves|implements?)\s+#(\d+)/gi);

            let issueNumber = null;

            if (branchMatch) {
              issueNumber = Number(branchMatch[1]);
            } else if (bodyMatch) {
              const lastMatch = bodyMatch[bodyMatch.length - 1];
              const fallbackMatch = lastMatch.match(/(\d+)/);
              if (fallbackMatch) {
                issueNumber = Number(fallbackMatch[1]);
              }
            }

            if (!issueNumber) {
              core.setOutput('issue_number', '');
              core.setOutput('found', 'false');
              return;
            }

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('found', 'true');

      - name: Close linked issue
        if: ${{ steps.linked-issue.outputs.found == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.linked-issue.outputs.issue_number }}');

            if (!issueNumber) {
              core.info('No linked issue number found.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
