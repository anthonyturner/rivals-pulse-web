name: Create PR from Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to open a PR from'
        required: true
      title:
        description: 'Pull request title'
        required: false
      body:
        description: 'Pull request body'
        required: false

      # This workflow creates a draft PR so you can review it manually before publishing.

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.inputs?.branch_name || '${{ github.event.inputs.branch_name }}';
            const title = context.payload.inputs?.title || '${{ github.event.inputs.title }}' || 'Draft PR';
            let body = context.payload.inputs?.body || '${{ github.event.inputs.body }}' || 'Draft PR created by workflow.';

            const issueMatch = branch.match(/(?:^|\/)issue-(\d+)(?:-|$)/i);
            if (issueMatch) {
              const issueNumber = issueMatch[1];
              const hasClosingReference = /\b(?:close|closes|closed|fix|fixes|resolve|resolves|implement|implements)\b\s*#\d+/i.test(body);

              if (!hasClosingReference) {
                body = `${body}\n\nCloses #${issueNumber}`;
              }
            }

            const response = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: 'master',
              body,
              draft: true
            });

            core.setOutput('pr_url', response.data.html_url);
