name: Issue Automation

on:
  workflow_dispatch:
    inputs:
      request_prompt:
        description: 'Client request, feature idea, bug report, or improvement request. If provided, it will be used to fill the issue details automatically.'
        required: false
      title:
        description: 'Issue title (optional if request prompt is provided)'
        required: false
      summary:
        description: 'Summary or problem statement (optional if request prompt is provided)'
        required: false
      user_story:
        description: 'User story or task description'
        required: false
      acceptance_criteria:
        description: 'Acceptance criteria (one per line)'
        required: false
      open_questions:
        description: 'Open questions'
        required: false
      risks_notes:
        description: 'Risks or notes'
        required: false
      labels:
        description: 'Comma-separated labels'
        required: false
        default: 'needs-triage'
      create_branch:
        description: 'Create a branch for this issue?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: write
  contents: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub issue
        id: create-issue
        env:
          REQUEST_PROMPT: ${{ github.event.inputs.request_prompt }}
          TITLE: ${{ github.event.inputs.title }}
          SUMMARY: ${{ github.event.inputs.summary }}
          USER_STORY: ${{ github.event.inputs.user_story }}
          ACCEPTANCE_CRITERIA: ${{ github.event.inputs.acceptance_criteria }}
          OPEN_QUESTIONS: ${{ github.event.inputs.open_questions }}
          RISKS_NOTES: ${{ github.event.inputs.risks_notes }}
          LABELS: ${{ github.event.inputs.labels }}
        uses: actions/github-script@v7
        with:
          script: |
            function inferAffectedArea(prompt) {
              const lowerPrompt = (prompt || '').toLowerCase();

              if (/heroes?\s+(screen|page|list)|hero\s+(screen|page|list)|heroes?/i.test(lowerPrompt)) {
                return 'Heroes screen';
              }
              if (/home(?:page|screen)|homepage|landing/i.test(lowerPrompt)) {
                return 'Home page';
              }
              if (/api|data sync|content|sync/i.test(lowerPrompt)) {
                return 'API / data sync';
              }
              if (/tier list|build|counter|playstyle/i.test(lowerPrompt)) {
                return 'Tier list / build data';
              }
              if (/video|media/i.test(lowerPrompt)) {
                return 'Video / media';
              }
              if (/glossary|term/i.test(lowerPrompt)) {
                return 'Glossary';
              }
              if (/news/i.test(lowerPrompt)) {
                return 'News / content';
              }
              if (/filter|search/i.test(lowerPrompt)) {
                return 'Filtering / search experience';
              }

              return 'TBD';
            }

            function slugify(value) {
              return (value || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .trim();
            }

            function deriveIssueDraft(prompt) {
              const cleanedPrompt = (prompt || '')
                .replace(/^(please|can you|could you|i want to|i'd like to|let's|make)\s+/i, '')
                .replace(/^(improve|enhance|update|add|fix|create|redesign|refactor)\s+/i, '')
                .replace(/\s+/g, ' ')
                .trim();

              const lowerPrompt = (prompt || '').toLowerCase();
              const isBug = /\b(bug|broken|error|fail|fails|doesn't work|does not work|regression|issue)\b/i.test(lowerPrompt);
              const isEnhancement = /\b(improve|enhance|ui|ux|design|redesign|screen|layout|hero|heroes|page|homepage)\b/i.test(lowerPrompt);
              const isChore = /\b(chore|maintenance|cleanup|refactor|docs|dependency|upgrade)\b/i.test(lowerPrompt);

              let titlePrefix = 'Update';
              if (isBug) titlePrefix = 'Fix';
              else if (isChore) titlePrefix = 'Improve';
              else if (/\b(add|create|new)\b/i.test(lowerPrompt)) titlePrefix = 'Add';
              else if (isEnhancement) titlePrefix = 'Improve';

              const titleBase = cleanedPrompt || 'requested change';
              const title = `${titlePrefix} ${titleBase}`.trim();

              const summary = cleanedPrompt
                ? `Client requested: ${cleanedPrompt}`
                : 'Client request captured for backlog triage.';

              const userStory = cleanedPrompt
                ? `As a user, I want ${cleanedPrompt.toLowerCase()} so that I can have a better experience.`
                : 'As a user, I want the requested change so that I can have a better experience.';

              const acceptanceCriteria = [
                isBug
                  ? '- The reported issue no longer reproduces in the relevant flow.'
                  : '- The requested change is implemented in the relevant area.',
                '- The experience remains usable across common screen sizes and states.',
                '- The change is verified in the affected screen, route, or workflow.'
              ].join('\n');

              const openQuestions = cleanedPrompt
                ? '- Which screen, route, or component should this target first?'
                : '- None at this time.';

              const risksNotes = cleanedPrompt
                ? '- Scope may need refinement once the affected area is confirmed.'
                : '- None at this time.';

              const labels = ['needs-triage'];
              if (isBug) labels.push('bug');
              if (isEnhancement || /\b(ui|ux|design|layout|screen)\b/i.test(lowerPrompt)) labels.push('ui');
              if (/\b(hero|heroes|home|page|screen)\b/i.test(lowerPrompt)) labels.push('frontend');
              if (isEnhancement) labels.push('enhancement');

              return {
                title,
                summary,
                userStory,
                acceptanceCriteria,
                openQuestions,
                risksNotes,
                labels,
                affectedArea: inferAffectedArea(prompt)
              };
            }

            const requestPrompt = process.env.REQUEST_PROMPT || '';
            const derived = deriveIssueDraft(requestPrompt);

            const title = process.env.TITLE || derived.title;
            const summary = process.env.SUMMARY || derived.summary;
            const userStory = process.env.USER_STORY || derived.userStory;
            const acceptanceCriteria = process.env.ACCEPTANCE_CRITERIA || derived.acceptanceCriteria;
            const openQuestions = process.env.OPEN_QUESTIONS || derived.openQuestions;
            const risksNotes = process.env.RISKS_NOTES || derived.risksNotes;
            const affectedArea = derived.affectedArea;
            const labels = (process.env.LABELS || derived.labels.join(','))
              .split(',')
              .map(label => label.trim())
              .filter(Boolean);

            const sections = [
              summary,
              '',
              '## User Story',
              userStory ? userStory : '- TBD',
              '',
              '## Affected Area',
              affectedArea ? affectedArea : '- TBD',
              '',
              '## Acceptance Criteria',
              acceptanceCriteria ? acceptanceCriteria : '- TBD',
              '',
              '## Open Questions',
              openQuestions ? openQuestions : '- None at this time.',
              '',
              '## Risks / Notes',
              risksNotes ? risksNotes : '- None at this time.'
            ];

            const body = sections.join('\n');

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels
            });

            core.setOutput('issue_number', response.data.number);
            core.setOutput('issue_url', response.data.html_url);
            core.setOutput('issue_title', title);
            core.setOutput('issue_slug', slugify(title));

      - name: Checkout repository
        if: ${{ github.event.inputs.create_branch == 'true' }}
        uses: actions/checkout@v4

      - name: Create branch for issue
        if: ${{ github.event.inputs.create_branch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TITLE_SLUG=$(echo "${{ steps.create-issue.outputs.issue_title }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          ISSUE_TITLE="${{ steps.create-issue.outputs.issue_title }}"
          if echo "$ISSUE_TITLE" | grep -qiE 'fix|bug|broken|error|issue'; then
            PREFIX="bug"
          elif echo "$ISSUE_TITLE" | grep -qiE 'chore|cleanup|refactor|docs|maintenance'; then
            PREFIX="chore"
          else
            PREFIX="feature"
          fi
          BRANCH_NAME="${PREFIX}/issue-${{ steps.create-issue.outputs.issue_number }}-${TITLE_SLUG}"
          git checkout -B "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Comment on issue with branch name
        if: ${{ github.event.inputs.create_branch == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.create-issue.outputs.issue_number }}'),
              body: `Branch created: \`${process.env.BRANCH_NAME}\``
            });
